---
openapi: 3.1.0
info:
  title: Execution Plane API
  description: Execution Plane operator endpoints — observe execution targets and work items.
  version: 0.1.0
paths:
  /api/execution_plane/v1/execution_targets:
    get:
      tags:
        - Execution Plane
      summary: List execution targets
      description: Retrieve registered execution targets.
      operationId: list_execution_targets
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionTargetListResponse'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-app-permission:
        resource: execution_target
        action: read
  /api/execution_plane/v1/work_items:
    get:
      tags:
        - Execution Plane
      summary: List work items
      description: Retrieve work items.
      operationId: list_work_items
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemListResponse'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-app-permission:
        resource: work_item
        action: read
  /api/execution_plane/v1/commands:
    post:
      tags:
        - Execution Plane Commands
      summary: Receive Command
      operationId: receive_command_api_execution_plane_v1_commands_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                message_id:
                  type: string
                  format: uuid
                  title: Message Id
                message_type:
                  type: string
                  const: command.submit
                  title: Message Type
                  default: command.submit
                command_id:
                  type: string
                  format: uuid
                  title: Command Id
                sequence:
                  type: integer
                  minimum: 0.0
                  title: Sequence
                  default: 0
                source_id:
                  type: string
                  maxLength: 255
                  minLength: 1
                  pattern: ^[A-Za-z0-9_.:@/-]+$
                  title: Source Id
                destination_id:
                  type: string
                  maxLength: 255
                  minLength: 1
                  pattern: ^[A-Za-z0-9_.:@/-]+$
                  title: Destination Id
                scope:
                  properties:
                    client_id:
                      type: string
                      maxLength: 255
                      minLength: 1
                      pattern: ^[A-Za-z0-9_.:@/-]+$
                      title: Client Id
                    project_id:
                      anyOf:
                        - type: string
                          format: uuid
                        - type: 'null'
                      title: Project Id
                    all_projects:
                      type: boolean
                      title: All Projects
                      default: false
                  additionalProperties: false
                  type: object
                  required:
                    - client_id
                    - project_id
                  title: CommandScope
                  description: Initiating client and exactly one project or an explicit all-project grant.
                command:
                  properties:
                    command_id:
                      type: string
                      format: uuid
                      title: Command Id
                    parent_command_id:
                      anyOf:
                        - type: string
                          format: uuid
                        - type: 'null'
                      title: Parent Command Id
                    command_type:
                      type: string
                      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
                      title: Command Type
                    command_revision:
                      type: integer
                      exclusiveMinimum: 0.0
                      title: Command Revision
                    target_url:
                      type: string
                      title: Target Url
                    callback_url:
                      type: string
                      title: Callback Url
                    payload:
                      additionalProperties: true
                      type: object
                      title: Payload
                    occurred_at:
                      type: string
                      format: date-time
                      title: Occurred At
                    parent_sequence:
                      anyOf:
                        - type: integer
                          exclusiveMinimum: 0.0
                        - type: 'null'
                      title: Parent Sequence
                    acknowledges_message_id:
                      anyOf:
                        - type: string
                          format: uuid
                        - type: 'null'
                      title: Acknowledges Message Id
                    execution_policy:
                      anyOf:
                        - properties:
                            timeout_seconds:
                              type: integer
                              exclusiveMinimum: 0.0
                              title: Timeout Seconds
                            max_attempts:
                              anyOf:
                                - type: integer
                                  exclusiveMinimum: 0.0
                                - type: 'null'
                              title: Max Attempts
                          additionalProperties: false
                          type: object
                          required:
                            - timeout_seconds
                          title: ExecutionPolicy
                          description: Separate bounded safe execution attempts from transport retries.
                        - type: 'null'
                  additionalProperties: false
                  type: object
                  required:
                    - command_id
                    - command_type
                    - command_revision
                    - target_url
                    - callback_url
                    - payload
                    - occurred_at
                  title: Command
                  description: Immutable logical command content; persistence snapshots nested values.
              additionalProperties: false
              type: object
              required:
                - message_id
                - command_id
                - source_id
                - destination_id
                - scope
                - command
              title: MessageEnvelope
              description: Signed transport identity around one logical command.
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportReceipt'
      security:
        - HTTPBearer: []
      x-app-permission:
        resource: null
        action: null
  /api/execution_plane/v1/commands/{command_id}:
    get:
      tags:
        - Execution Plane Commands
      summary: Get Command
      operationId: get_command_api_execution_plane_v1_commands__command_id__get
      security:
        - HTTPBearer: []
      parameters:
        - name: command_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Command Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandRead'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-app-permission:
        resource: null
        action: null
  /api/execution_plane/v1/commands/{command_id}/children:
    get:
      tags:
        - Execution Plane Commands
      summary: Get Children
      operationId: get_children_api_execution_plane_v1_commands__command_id__children_get
      security:
        - HTTPBearer: []
      parameters:
        - name: command_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Command Id
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
            title: After
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 200
            minimum: 1
            default: 50
            title: Limit
        - name: recover
          in: query
          required: false
          schema:
            type: boolean
            default: false
            title: Recover
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildPage'
        '422':
          description: Validation Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-app-permission:
        resource: null
        action: null
  /api/execution_plane/v1/capabilities:
    get:
      tags:
        - Execution Plane Commands
      summary: Capabilities
      operationId: capabilities_api_execution_plane_v1_capabilities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesRead'
      security:
        - HTTPBearer: []
      x-app-permission:
        resource: null
        action: null
components:
  schemas:
    CapabilitiesRead:
      properties:
        protocol_revision:
          type: integer
          const: 1
          title: Protocol Revision
          default: 1
        commands:
          additionalProperties:
            items:
              type: integer
            type: array
          type: object
          title: Commands
        receipt_handlers:
          items:
            type: string
          type: array
          title: Receipt Handlers
        completion_handlers:
          items:
            type: string
          type: array
          title: Completion Handlers
      additionalProperties: false
      type: object
      required:
        - commands
        - receipt_handlers
        - completion_handlers
      title: CapabilitiesRead
      description: Only installed revisions and handlers are advertised.
    ChildCommandRead:
      properties:
        command_id:
          type: string
          format: uuid
          title: Command Id
        command_type:
          type: string
          title: Command Type
          default: ''
        status:
          $ref: '#/components/schemas/CommandStatus'
        parent_command_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Parent Command Id
        resource:
          anyOf:
            - $ref: '#/components/schemas/ResourceReference'
            - type: 'null'
        latest_child_sequence:
          type: integer
          minimum: 0.0
          title: Latest Child Sequence
          default: 0
        delivery_state:
          anyOf:
            - type: string
            - type: 'null'
          title: Delivery State
        handling_state:
          anyOf:
            - type: string
            - type: 'null'
          title: Handling State
        error_code:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Code
        reconciliation_required:
          type: boolean
          title: Reconciliation Required
          default: false
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Created At
        accepted_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Accepted At
        handled_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Handled At
        parent_sequence:
          type: integer
          exclusiveMinimum: 0.0
          title: Parent Sequence
        recovery_message:
          anyOf:
            - $ref: '#/components/schemas/MessageEnvelope'
            - type: 'null'
      additionalProperties: false
      type: object
      required:
        - command_id
        - status
        - parent_sequence
      title: ChildCommandRead
      description: Ordered child status, optionally carrying authorized outcome recovery.
    ChildPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ChildCommandRead'
          type: array
          title: Items
        next_after:
          anyOf:
            - type: integer
              minimum: 0.0
            - type: 'null'
          title: Next After
      additionalProperties: false
      type: object
      required:
        - items
      title: ChildPage
      description: Bounded child page with a stable per-parent cursor.
    Command:
      properties:
        command_id:
          type: string
          format: uuid
          title: Command Id
        parent_command_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Parent Command Id
        command_type:
          type: string
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
          title: Command Type
        command_revision:
          type: integer
          exclusiveMinimum: 0.0
          title: Command Revision
        target_url:
          type: string
          title: Target Url
        callback_url:
          type: string
          title: Callback Url
        payload:
          additionalProperties: true
          type: object
          title: Payload
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        parent_sequence:
          anyOf:
            - type: integer
              exclusiveMinimum: 0.0
            - type: 'null'
          title: Parent Sequence
        acknowledges_message_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Acknowledges Message Id
        execution_policy:
          anyOf:
            - $ref: '#/components/schemas/ExecutionPolicy'
            - type: 'null'
      additionalProperties: false
      type: object
      required:
        - command_id
        - command_type
        - command_revision
        - target_url
        - callback_url
        - payload
        - occurred_at
      title: Command
      description: Immutable logical command content; persistence snapshots nested values.
    CommandRead:
      properties:
        command_id:
          type: string
          format: uuid
          title: Command Id
        command_type:
          type: string
          title: Command Type
          default: ''
        status:
          $ref: '#/components/schemas/CommandStatus'
        parent_command_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Parent Command Id
        resource:
          anyOf:
            - $ref: '#/components/schemas/ResourceReference'
            - type: 'null'
        latest_child_sequence:
          type: integer
          minimum: 0.0
          title: Latest Child Sequence
          default: 0
        delivery_state:
          anyOf:
            - type: string
            - type: 'null'
          title: Delivery State
        handling_state:
          anyOf:
            - type: string
            - type: 'null'
          title: Handling State
        error_code:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Code
        reconciliation_required:
          type: boolean
          title: Reconciliation Required
          default: false
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Created At
        accepted_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Accepted At
        handled_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Handled At
      additionalProperties: false
      type: object
      required:
        - command_id
        - status
      title: CommandRead
      description: Generic command status; deliberately has no request or private result.
    CommandScope:
      properties:
        client_id:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[A-Za-z0-9_.:@/-]+$
          title: Client Id
        project_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Project Id
        all_projects:
          type: boolean
          title: All Projects
          default: false
      additionalProperties: false
      type: object
      required:
        - client_id
        - project_id
      title: CommandScope
      description: Initiating client and exactly one project or an explicit all-project grant.
    CommandStatus:
      type: string
      enum:
        - accepted
        - running
        - succeeded
        - failed
        - cancel_requested
        - cancelled
        - superseded
        - outcome_unknown
      title: CommandStatus
      description: Participant-visible action status, independent of transport receipt.
    ExecutionPolicy:
      properties:
        timeout_seconds:
          type: integer
          exclusiveMinimum: 0.0
          title: Timeout Seconds
        max_attempts:
          anyOf:
            - type: integer
              exclusiveMinimum: 0.0
            - type: 'null'
          title: Max Attempts
      additionalProperties: false
      type: object
      required:
        - timeout_seconds
      title: ExecutionPolicy
      description: Separate bounded safe execution attempts from transport retries.
    ExecutionTargetFacadeRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        cluster_id:
          type: string
          format: uuid
          title: Cluster Id
        name:
          type: string
          title: Name
        backend_type:
          type: string
          title: Backend Type
        endpoint:
          type: string
          title: Endpoint
        placement:
          oneOf:
            - $ref: '#/components/schemas/KubernetesPlacement'
            - $ref: '#/components/schemas/RHELPlacement'
          title: Placement
          discriminator:
            propertyName: type
            mapping:
              kubernetes: '#/components/schemas/KubernetesPlacement'
              rhel: '#/components/schemas/RHELPlacement'
        status:
          type: string
          title: Status
        enabled:
          type: boolean
          title: Enabled
        is_default:
          type: boolean
          title: Is Default
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      additionalProperties: false
      type: object
      required:
        - id
        - cluster_id
        - name
        - backend_type
        - endpoint
        - placement
        - status
        - enabled
        - is_default
        - created_at
        - updated_at
      title: ExecutionTargetFacadeRead
      description: Safe shared target fields after AO project authorization.
    ExecutionTargetListResponse:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/ExecutionTargetFacadeRead'
          type: array
          title: Resources
        next:
          anyOf:
            - type: string
            - type: 'null'
          title: Next
        prev:
          anyOf:
            - type: string
            - type: 'null'
          title: Prev
        total:
          anyOf:
            - type: integer
            - type: 'null'
          title: Total
      type: object
      required:
        - resources
      title: ExecutionTargetListResponse
      description: Paginated list response for ExecutionTarget.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    KubernetesPlacement:
      properties:
        type:
          type: string
          const: kubernetes
          title: Type
          default: kubernetes
        namespace:
          type: string
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          title: Namespace
        node_selectors:
          items:
            type: string
          type: array
          title: Node Selectors
        tolerations:
          items:
            type: string
          type: array
          title: Tolerations
      additionalProperties: false
      type: object
      required:
        - namespace
      title: KubernetesPlacement
      description: Kubernetes placement contract, independent of Kubernetes libraries.
    MessageEnvelope:
      properties:
        message_id:
          type: string
          format: uuid
          title: Message Id
        message_type:
          type: string
          const: command.submit
          title: Message Type
          default: command.submit
        command_id:
          type: string
          format: uuid
          title: Command Id
        sequence:
          type: integer
          minimum: 0.0
          title: Sequence
          default: 0
        source_id:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[A-Za-z0-9_.:@/-]+$
          title: Source Id
        destination_id:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[A-Za-z0-9_.:@/-]+$
          title: Destination Id
        scope:
          $ref: '#/components/schemas/CommandScope'
        command:
          $ref: '#/components/schemas/Command'
      additionalProperties: false
      type: object
      required:
        - message_id
        - command_id
        - source_id
        - destination_id
        - scope
        - command
      title: MessageEnvelope
      description: Signed transport identity around one logical command.
    RHELPlacement:
      properties:
        type:
          type: string
          const: rhel
          title: Type
          default: rhel
      additionalProperties: false
      type: object
      title: RHELPlacement
      description: Placement for a supported RHEL backend.
    ResourceReference:
      properties:
        kind:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[A-Za-z0-9_.:@/-]+$
          title: Kind
        resource_id:
          type: string
          format: uuid
          title: Resource Id
        resource_key:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Resource Key
        revision:
          anyOf:
            - type: integer
              exclusiveMinimum: 0.0
            - type: 'null'
          title: Revision
      additionalProperties: false
      type: object
      required:
        - kind
        - resource_id
      title: ResourceReference
      description: Safe reference from a command to a participant-owned resource.
    TransportReceipt:
      properties:
        received:
          type: boolean
          const: true
          title: Received
        message_id:
          type: string
          format: uuid
          title: Message Id
        duplicate:
          type: boolean
          title: Duplicate
          default: false
      additionalProperties: false
      type: object
      required:
        - received
        - message_id
      title: TransportReceipt
      description: A successful transport response, independent of the asynchronous ACK.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
    WorkItemFacadeRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        project_id:
          type: string
          format: uuid
          title: Project Id
        request_id:
          type: string
          title: Request Id
        work_correlation_id:
          type: string
          format: uuid
          title: Work Correlation Id
        status:
          type: string
          title: Status
        result:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Result
        result_omitted:
          type: boolean
          title: Result Omitted
          default: false
        result_size_bytes:
          anyOf:
            - type: integer
            - type: 'null'
          title: Result Size Bytes
        execution_target_id:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
          title: Execution Target Id
        created_at:
          type: string
          format: date-time
          title: Created At
        claimed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Claimed At
        completed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Completed At
        backend_resource_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Backend Resource Name
        backend_resource_uid:
          anyOf:
            - type: string
            - type: 'null'
          title: Backend Resource Uid
        resource_cleanup_status:
          type: string
          title: Resource Cleanup Status
      additionalProperties: false
      type: object
      required:
        - id
        - project_id
        - request_id
        - work_correlation_id
        - status
        - created_at
        - resource_cleanup_status
      title: WorkItemFacadeRead
      description: Safe shared work state after AO project authorization.
    WorkItemListResponse:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/WorkItemFacadeRead'
          type: array
          title: Resources
        next:
          anyOf:
            - type: string
            - type: 'null'
          title: Next
        prev:
          anyOf:
            - type: string
            - type: 'null'
          title: Prev
        total:
          anyOf:
            - type: integer
            - type: 'null'
          title: Total
      type: object
      required:
        - resources
      title: WorkItemListResponse
      description: Paginated list response for WorkItem.
  securitySchemes:
    bearerAuth:
      type: http
      description: JWT token authentication
      scheme: bearer
      bearerFormat: JWT
    HTTPBearer:
      type: http
      scheme: bearer
